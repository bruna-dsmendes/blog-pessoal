spring.application.name=blogpessoal

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# O schema e versionado pelo Flyway. O Hibernate nao altera mais o banco.
# Depois de confirmar que as migrations batem com o banco, troque para "validate".
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

# Paginacao
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Seguranca: sem valor padrao de proposito. Falha no boot se a variavel nao existir.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cookie de sessão. Secure=true exige HTTPS, entao so o perfil dev desliga.
# SameSite=Lax barra o envio do cookie em POST vindo de outro site, o que ja
# cobre CSRF nas rotas de escrita.
app.cookie.name=${COOKIE_NAME:blog_token}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packagesToScan=com.generation.blogpessoal.controller
springdoc.swagger-ui.use-root-path=true

# Envio de e-mail (Brevo). Sem as variaveis, o envio e desligado e a aplicacao
# sobe normalmente: o resto do sistema nao depende disso.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.remetente=${MAIL_FROM:nao-responda@simetria.dev}
app.mail.nome-remetente=${MAIL_FROM_NAME:Simetria.Dev}
app.mail.habilitado=${MAIL_ENABLED:false}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.senha.token-validade-minutos=${SENHA_TOKEN_MINUTOS:30}
