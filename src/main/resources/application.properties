spring.application.name=blogpessoal

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# O schema e versionado pelo Flyway. O Hibernate nao altera mais o banco.
# Depois de confirmar que as migrations batem com o banco, troque para "validate".
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

# Paginacao
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Seguranca: sem valor padrao de proposito. Falha no boot se a variavel nao existir.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cookie de sessão. Secure=true exige HTTPS, entao so o perfil dev desliga.
# SameSite=Lax barra o envio do cookie em POST vindo de outro site, o que ja
# cobre CSRF nas rotas de escrita.
app.cookie.name=${COOKIE_NAME:blog_token}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packagesToScan=com.generation.blogpessoal.controller
springdoc.swagger-ui.use-root-path=true

# Envio de e-mail pela API HTTP do Brevo. SMTP nao serve: a hospedagem bloqueia
# saida na porta 587. Sem MAIL_API_KEY o envio fica desligado e a aplicacao sobe
# normalmente, porque o resto do sistema nao depende disso.
app.mail.api-url=${MAIL_API_URL:https://api.brevo.com/v3/smtp/email}
app.mail.api-key=${MAIL_API_KEY:}

app.mail.remetente=${MAIL_FROM:nao-responda@simetria.dev}
app.mail.nome-remetente=${MAIL_FROM_NAME:Simetria.Dev}
app.mail.habilitado=${MAIL_ENABLED:false}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.senha.token-validade-minutos=${SENHA_TOKEN_MINUTOS:30}
