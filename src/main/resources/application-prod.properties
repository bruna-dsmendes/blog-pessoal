spring.datasource.url=jdbc:postgresql://${POSTGRESHOST}:${POSTGRESPORT}/${POSTGRESDATABASE}
spring.datasource.username=${POSTGRESUSER}
spring.datasource.password=${POSTGRESPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# O banco de producao ja existe com as tabelas criadas pelo Hibernate.
# O baseline marca o estado atual como V1 e roda so as migrations seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
