spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Nos testes o schema vem do proprio Hibernate, nao do Flyway.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=dGVzdGUtc2VjcmV0LWtleS1jb20tbWFpcy1kZS0zMi1ieXRlcy0xMjM0NTY=
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173

app.cookie.name=blog_token
app.cookie.secure=false
app.cookie.same-site=Lax

spring.mail.host=localhost
app.mail.habilitado=false
app.mail.remetente=teste@simetria.dev
app.mail.nome-remetente=Simetria.Dev
app.frontend-url=http://localhost:5173
app.senha.token-validade-minutos=30
