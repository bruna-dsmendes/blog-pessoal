services:
  postgres:
    image: postgres:16-alpine
    container_name: blogpessoal-db
    environment:
      POSTGRES_DB: db_blogpessoal
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      - "5432:5432"
    volumes:
      - blogpessoal-data:/var/lib/postgresql/data

volumes:
  blogpessoal-data:
